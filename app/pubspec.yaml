name: njqca_flutter
description: NewJaisa Diagnostic App — Flutter Windows Desktop
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────────────────────
  google_fonts: ^6.2.1              # Hanken Grotesk
  window_manager: ^0.3.8            # window size, title bar, min size

  # ── State management ────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Networking (login + inspection type only) ────────────────────
  dio: ^5.4.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # ── Secure storage ───────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0

  # ── Local prefs (saved inspection type, keep-signed-in) ─────────
  shared_preferences: ^2.2.3

  # ── File paths ───────────────────────────────────────────────────
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Utilities ────────────────────────────────────────────────────
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  # assets added per screen as we build
  assets:
    - assets/images/nj_logo_white.png

